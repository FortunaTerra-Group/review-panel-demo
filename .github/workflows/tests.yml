name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "django>=5,<6" "redis>=5" pytest pytest-django "fakeredis[lua]>=2.20"
      - run: pytest tests -q
